<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Helpdesk - Histórico</title>

    <link rel="stylesheet" href="styles.css">

</head>


<body class="dark-mode">





<!-- =====================================================
     MENU LATERAL
===================================================== -->


<div
    class="sidebar"
    id="sidebar"
>


    <div class="sidebar-title">

        Helpdesk

    </div>



    <nav class="sidebar-menu">


        <a href="index.html">

            Atendimentos

        </a>




        <a href="historico.html">

            Histórico

        </a>



    </nav>



</div>




<div
    class="overlay"
    id="overlay"
></div>







<!-- =====================================================
     HEADER
===================================================== -->


<header class="topbar">



<button
    id="menu-btn"
    class="hamburger"
    type="button"
>

    ☰

</button>





<div class="helpdesk-header">


<h1 class="title-helpdesk">

    Histórico

</h1>



<p class="subtitle-helpdesk">

    Atendimentos removidos

</p>



</div>





<!-- LIXEIRA GLOBAL -->


<button
    id="delete-all-history"
    class="global-trash-btn"
    title="apagar histórico"
>

    🗑

</button>



</header>







<!-- =====================================================
     CONTEÚDO
===================================================== -->


<main>





<!-- =====================================================
     HISTÓRICO HUGGY
===================================================== -->


<section class="column history-column">



<div class="history-header">


<h2>

    Histórico Huggy 💬

</h2>



<button
    id="delete-huggy-history"
    class="history-trash-btn"
    title="apagar histórico"
>


    🗑


</button>



</div>





<div
    id="huggy-history-grid"
    class="cards-grid"
>


</div>



</section>









<!-- =====================================================
     HISTÓRICO TELEFONE
===================================================== -->


<section class="column history-column">



<div class="history-header">


<h2>

    Histórico Caixa 📞

</h2>




<button
    id="delete-caixa-history"
    class="history-trash-btn"
    title="apagar histórico"
>

    🗑

</button>



</div>





<div
    id="caixa-history-grid"
    class="cards-grid"
>


</div>




</section>







</main>








<footer>


<span>

    Histórico de Atendimentos

</span>




<span id="history-count">

    0 registros

</span>



</footer>









<!-- =====================================================
     TEMPLATE HISTÓRICO CARD
===================================================== -->


<template id="historyCardTemplate">


<div class="card history-card">



<div class="card-top">


<div class="card-actions">



<span class="history-date">

    --

</span>



</div>



</div>






<div class="field">


<label>

Nome do Cliente

</label>


<input
    type="text"
    readonly
    data-field="nome"
>


</div>






<div class="field">


<label>

CPF/CNPJ

</label>


<input
    type="text"
    readonly
    data-field="cpf"
>


</div>






<div class="field">


<label>

Protocolo

</label>


<input
    type="text"
    readonly
    data-field="protocolo"
>


</div>






<div class="field">


<label>

Caixa

</label>


<input
    type="text"
    readonly
    data-field="caixa"
>


</div>







<div class="field">


<label>

Relato/Informações

</label>


<textarea
    readonly
    data-field="relato"
></textarea>


</div>







<div class="field os-field">


<label>

Agendar O.S?

</label>



<input
    type="text"
    readonly
    data-field="os"
>


</div>







<div class="field os-description">


<label>

Informação da O.S

</label>


<textarea
    readonly
    data-field="os_info"
></textarea>


</div>






<div class="card-footer">


<small class="created-at">

--

</small>



</div>


</div>


</template>



<script src="historico.js"></script>


</body>

</html>
