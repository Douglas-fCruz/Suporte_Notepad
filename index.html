<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Helpdesk - Gestão de Chamados</title>

    <link rel="stylesheet" href="styles.css">

</head>


<body class="dark-mode">


<!-- =====================================================
     MENU LATERAL
===================================================== -->

<div class="sidebar" id="sidebar">

    <div class="sidebar-title">
        Helpdesk
    </div>


    <nav class="sidebar-menu">

        <a href="index.html">
            Atendimentos
        </a>


        <a href="historico.html">
            Histórico
        </a>

    </nav>


</div>



<div class="overlay" id="overlay"></div>




<!-- =====================================================
     HEADER
===================================================== -->

<header class="topbar">


    <button
        id="menu-btn"
        class="hamburger"
        type="button"
    >

        ☰

    </button>



    <div class="helpdesk-header">


        <h1 class="title-helpdesk">

            Helpdesk

        </h1>



        <p class="subtitle-helpdesk">

            Gestão de Chamados

        </p>


    </div>



    <div class="search-area">


        <input
            type="text"
            id="searchInput"
            placeholder="Pesquisar nome, CPF, protocolo ou telefone..."
        >


    </div>


</header>





<!-- =====================================================
     CONTEÚDO
===================================================== -->


<main>



<!-- =====================================================
     HUGGY
===================================================== -->


<section
    class="column"
    id="huggy-column"
>



    <div
        class="column-header collapsible"
        data-target="huggy-grid"
    >


        <h2>

            Atendimentos HUGGY 💬

        </h2>



        <span
            id="huggy-count"
            class="counter"
        >

            0 atendimentos

        </span>


    </div>





    <div
        id="huggy-grid"
        class="cards-grid"
    >



        <button
            id="huggy-add-btn"
            class="add-card-btn"
            onclick="createCard('huggy')"
        >

            +

        </button>


    </div>



</section>








<!-- =====================================================
     CAIXA
===================================================== -->


<section
    class="column"
    id="caixa-column"
>




    <div
        class="column-header collapsible"
        data-target="caixa-grid"
    >


        <h2>

            Atendimentos Caixa 📞

        </h2>



        <span
            id="caixa-count"
            class="counter"
        >

            0 atendimentos

        </span>



    </div>







    <div
        id="caixa-grid"
        class="cards-grid"
    >



        <button
            id="caixa-add-btn"
            class="add-card-btn"
            onclick="createCard('caixa')"
        >

            +

        </button>


    </div>




</section>





</main>






<!-- =====================================================
     FOOTER
===================================================== -->


<footer>


    <span>

        Notepad de Atendimentos

    </span>



    <span id="last-save">

        Última alteração: --

    </span>


</footer>







<!-- =====================================================
     TEMPLATE CARD
===================================================== -->


<template id="cardTemplate">


<div
    class="card"
    draggable="true"
>




<div class="card-top">



    <div class="card-actions">



        <span class="drag-icon">

            ☰

        </span>





        <button
            class="priority-btn"
            title="priorizar atendimento"
        >

            ☆

        </button>







        <span
            class="timer"
            data-opened-at=""
        >

            00:00:00

        </span>




    </div>







    <button
        class="delete-btn"
        type="button"
    >

        ✕

    </button>




</div>





</div>


</template>







<script src="script.js"></script>


</body>

</html>
